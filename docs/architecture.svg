<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Where each part runs: your phone uploads a new item to Supabase, Supabase wakes five Grok Bots in Cursor, and a policy-checking Mac worker publishes to eBay, saves Vinted drafts, reads Vinted buyer email, serves a local dashboard, and pushes updates to the phone.">
  <title>Where each part runs</title>
  <style>
    :root {
      --bg:#faf9f7; --card:#ffffff; --ink:#1f1e1d; --muted:#6b6862; --line:#ddd8cf; --arrow:#8a857d;
      --phone:#5b5fb0; --phone-soft:#eeeef9; --phone-edge:#c9cbea;
      --data:#66717c; --data-soft:#f0f2f4; --data-edge:#cbd1d6;
      --bot:#c96442; --bot-soft:#fbf0ea; --bot-edge:#ecc6b3;
      --mac:#2f7a68; --mac-soft:#eaf4f0; --mac-edge:#b3d6cb;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        color-scheme:dark;
        --bg:#1c1b1a; --card:#262523; --ink:#ece9e4; --muted:#a39f98; --line:#3d3a36; --arrow:#8f8a82;
        --phone:#9ea2ea; --phone-soft:#22233a; --phone-edge:#44477a;
        --data:#b9c1c9; --data-soft:#22272b; --data-edge:#46515a;
        --bot:#e08a66; --bot-soft:#2b221e; --bot-edge:#6b3f2e;
        --mac:#5fb39d; --mac-soft:#1c2825; --mac-edge:#2f5a4f;
      }
    }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .bg { fill:var(--bg); }
    .zone-phone { fill:var(--phone-soft); stroke:var(--phone-edge); }
    .zone-data { fill:var(--data-soft); stroke:var(--data-edge); }
    .zone-bot { fill:var(--bot-soft); stroke:var(--bot-edge); }
    .zone-mac { fill:var(--mac-soft); stroke:var(--mac-edge); }
    .card { fill:var(--card); stroke:var(--line); }
    .card-phone { fill:var(--card); stroke:var(--phone); stroke-width:1.5; }
    .card-data { fill:var(--card); stroke:var(--data); stroke-width:1.5; }
    .card-bot { fill:var(--card); stroke:var(--bot); stroke-width:1.5; }
    .card-mac { fill:var(--card); stroke:var(--mac); stroke-width:1.5; }
    .title { fill:var(--ink); font-size:18px; font-weight:700; }
    .t { fill:var(--ink); font-size:12.5px; font-weight:650; }
    .s { fill:var(--muted); font-size:10.5px; }
    .m { fill:var(--muted); font:10px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .k { font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.1em; }
    .kp { fill:var(--phone); } .kd { fill:var(--data); } .kb { fill:var(--bot); } .km { fill:var(--mac); }
    .legend { fill:var(--muted); font-size:10.5px; }
    .label { fill:var(--muted); font-size:9.5px; }
    .ln { fill:none; stroke:var(--arrow); stroke-width:1.5; }
    .ln-phone { stroke:var(--phone); } .ln-data { stroke:var(--data); } .ln-bot { stroke:var(--bot); } .ln-mac { stroke:var(--mac); }
    .dash { stroke-dasharray:5 4; }
    .ah { fill:var(--arrow); } .ah-phone { fill:var(--phone); } .ah-data { fill:var(--data); } .ah-bot { fill:var(--bot); } .ah-mac { fill:var(--mac); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-phone" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-bot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-bot" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-mac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-mac" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="600"/>
  <text class="title" x="18" y="29">Where each part runs</text>
  <g aria-label="Colour legend">
    <rect class="zone-phone" x="402" y="16" width="12" height="12" rx="3"/><text class="legend" x="420" y="26">your phone</text>
    <rect class="zone-data" x="500" y="16" width="12" height="12" rx="3"/><text class="legend" x="518" y="26">Supabase</text>
    <rect class="zone-bot" x="601" y="16" width="12" height="12" rx="3"/><text class="legend" x="619" y="26">Grok Bots</text>
    <rect class="zone-mac" x="704" y="16" width="12" height="12" rx="3"/><text class="legend" x="722" y="26">your Mac</text>
  </g>

  <rect class="zone-phone" x="16" y="50" width="164" height="462" rx="14"/>
  <text class="k kp" x="30" y="75">YOUR PHONE</text>
  <rect class="card-phone" x="30" y="92" width="136" height="124" rx="10"/>
  <text class="t" x="42" y="114">Sell with 2ndLife</text>
  <text class="s" x="42" y="134">Shortcut asks size,</text>
  <text class="s" x="42" y="150">condition and flaws</text>
  <text class="s" x="42" y="170">uploads photos with</text>
  <text class="s" x="42" y="186">the anon key</text>
  <text class="m" x="42" y="204">insert only</text>

  <rect class="card-phone" x="30" y="232" width="136" height="112" rx="10"/>
  <text class="t" x="42" y="254">ntfy app</text>
  <text class="s" x="42" y="274">live on eBay</text>
  <text class="s" x="42" y="290">Vinted draft ready</text>
  <text class="s" x="42" y="306">escalations</text>
  <text class="s" x="42" y="322">reply suggestions</text>

  <rect class="card-phone" x="30" y="360" width="136" height="112" rx="10"/>
  <text class="t" x="42" y="382">Vinted app</text>
  <text class="s" x="42" y="402">Drafts</text>
  <text class="s" x="42" y="418">you tap Upload</text>
  <text class="m" x="42" y="442">the only send</text>
  <text class="m" x="42" y="458">on Vinted</text>

  <rect class="zone-data" x="192" y="50" width="190" height="462" rx="14"/>
  <text class="k kd" x="206" y="75">SUPABASE</text>
  <rect class="card-data" x="206" y="92" width="162" height="78" rx="10"/>
  <text class="t" x="218" y="114">Photo bucket intake</text>
  <text class="s" x="218" y="136">private</text>
  <text class="m" x="218" y="154">phone upload only</text>

  <rect class="card-data" x="206" y="186" width="162" height="116" rx="10"/>
  <text class="k kd" x="218" y="208">TABLES</text>
  <text class="m" x="218" y="232">grok_items</text>
  <text class="m" x="218" y="254">grok_inbox</text>
  <text class="m" x="218" y="276">grok_vinted_messages</text>

  <rect class="card-data" x="206" y="318" width="162" height="112" rx="10"/>
  <text class="t" x="218" y="340">grok_hooks + pg_net</text>
  <text class="s" x="218" y="362">triggers wake the</text>
  <text class="s" x="218" y="378">right bot within seconds</text>
  <text class="m" x="218" y="404">webhook POST</text>

  <rect class="zone-bot" x="394" y="50" width="286" height="462" rx="14"/>
  <text class="k kb" x="408" y="75">GROK BOTS IN CURSOR</text>
  <rect class="card-bot" x="408" y="92" width="178" height="58" rx="9"/>
  <text class="t" x="420" y="112">1 Researcher</text>
  <text class="s" x="420" y="128">identity, RRP, condition</text>
  <text class="m" x="420" y="143" style="font-size:8.7px">new → researching → researched</text>

  <rect class="card-bot" x="408" y="158" width="174" height="58" rx="9"/>
  <text class="t" x="420" y="178">2 eBay Poster</text>
  <text class="s" x="420" y="194">eBay comps, price, listing</text>
  <text class="m" x="420" y="209" style="font-size:8.7px">waiting → pricing → ready</text>

  <rect class="card-bot" x="408" y="224" width="174" height="58" rx="9"/>
  <text class="t" x="420" y="244">3 Vinted Poster</text>
  <text class="s" x="420" y="260">Vinted price and listing</text>
  <text class="m" x="420" y="275" style="font-size:8.7px">waiting → pricing → ready</text>

  <rect class="card-bot" x="408" y="290" width="174" height="58" rx="9"/>
  <text class="t" x="420" y="310">4 eBay Buyer</text>
  <text class="s" x="420" y="326">questions and Best Offers</text>
  <text class="m" x="420" y="341" style="font-size:8.7px">grok_inbox new → answered</text>

  <rect class="card-bot" x="408" y="356" width="174" height="58" rx="9"/>
  <text class="t" x="420" y="376">5 Vinted Reply</text>
  <text class="s" x="420" y="392">reply suggestions</text>
  <text class="m" x="420" y="407" style="font-size:8.7px">messages new → suggested</text>

  <rect class="card" x="598" y="92" width="68" height="58" rx="9"/>
  <text class="k kb" x="610" y="112">SEARCH</text>
  <text class="t" x="610" y="130">Tavily</text>
  <text class="s" x="610" y="143">Bots 1-3</text>
  <path class="ln ln-bot" d="M598 121 H588" marker-end="url(#arrow-bot)"/>
  <path class="ln ln-bot" d="M598 132 H590 V187 H584" marker-end="url(#arrow-bot)"/>
  <path class="ln ln-bot" d="M598 140 H592 V253 H584" marker-end="url(#arrow-bot)"/>

  <rect class="card" x="408" y="430" width="258" height="52" rx="9"/>
  <text class="s" x="537" y="452" text-anchor="middle">webhook + 5-min schedule</text>
  <text class="s" x="537" y="468" text-anchor="middle">safety net</text>

  <rect class="zone-mac" x="692" y="50" width="292" height="462" rx="14"/>
  <text class="k km" x="706" y="75">YOUR MAC</text>
  <rect class="card-mac" x="706" y="92" width="264" height="88" rx="10"/>
  <text class="t" x="718" y="114">Worker</text>
  <text class="s" x="718" y="134">reads ready rows every 1 min</text>
  <text class="s" x="718" y="150">holds eBay token, Vinted login</text>
  <text class="s" x="718" y="166">and Gmail app password</text>

  <rect class="card-mac" x="706" y="194" width="264" height="118" rx="10"/>
  <text class="t" x="718" y="216">policy.json gate</text>
  <text class="s" x="718" y="236">floor 80% of list price</text>
  <text class="s" x="718" y="252">auto-accept 92%</text>
  <text class="s" x="718" y="268">blocks emails, phone numbers,</text>
  <text class="s" x="718" y="284">outside links and off-platform payment</text>
  <text class="m" x="718" y="300">checked before every action</text>

  <rect class="card-mac" x="706" y="328" width="126" height="72" rx="10"/>
  <text class="t" x="718" y="350">eBay API</text>
  <text class="s" x="718" y="370">publish, replies,</text>
  <text class="s" x="718" y="386">Best Offers</text>

  <rect class="card-mac" x="844" y="328" width="126" height="72" rx="10"/>
  <text class="t" x="856" y="350">Worker Chrome</text>
  <text class="s" x="856" y="366">Vinted draft</text>
  <text class="s" x="856" y="381">Save draft</text>
  <text class="s" x="856" y="396">never Upload</text>

  <rect class="card-mac" x="706" y="414" width="126" height="78" rx="10"/>
  <text class="t" x="718" y="436">Gmail read-only</text>
  <text class="s" x="718" y="454">Vinted buyer emails</text>
  <text class="m" x="718" y="470" style="font-size:8.5px">→ grok_vinted_</text>
  <text class="m" x="718" y="483" style="font-size:8.5px">messages</text>

  <rect class="card-mac" x="844" y="414" width="126" height="78" rx="10"/>
  <text class="t" x="856" y="436">Dashboard</text>
  <text class="m" x="856" y="458">127.0.0.1:4545</text>

  <path class="ln ln-phone" d="M166 154 H204" marker-end="url(#arrow-phone)"/>
  <text class="label" x="185" y="144" text-anchor="middle">upload</text>
  <path class="ln ln-bot dash" d="M368 374 H386 V121 H406" marker-end="url(#arrow-bot)"/>
  <text class="label" x="404" y="360" text-anchor="middle" transform="rotate(-90 404 360)">wake</text>
  <path class="ln ln-bot" d="M406 252 H370" marker-end="url(#arrow-bot)"/>
  <text class="label" x="392" y="235" text-anchor="middle" transform="rotate(-90 392 235)">write</text>
  <path class="ln ln-mac dash" d="M368 286 H386 V504 H688 V136 H704" marker-end="url(#arrow-mac)"/>
  <text class="label" x="537" y="498" text-anchor="middle">poll ready rows every 1 min</text>

  <text class="k" x="20" y="546" fill="var(--muted)">EXTERNAL</text>
  <rect class="card" x="706" y="528" width="126" height="54" rx="10"/>
  <text class="t" x="769" y="560" text-anchor="middle">ebay.co.uk</text>
  <rect class="card" x="844" y="528" width="126" height="54" rx="10"/>
  <text class="t" x="907" y="560" text-anchor="middle">vinted.co.uk</text>
  <path class="ln ln-mac" d="M769 406 H698 V518 H769 V526" marker-end="url(#arrow-mac)"/>
  <path class="ln ln-mac" d="M907 406 H978 V518 H907 V526" marker-end="url(#arrow-mac)"/>
  <path class="ln ln-mac dash" d="M844 555 H838 V453 H834" marker-end="url(#arrow-mac)"/>
</svg>
