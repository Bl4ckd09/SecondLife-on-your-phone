<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="A Best Offer end to end: an eBay buyer makes an offer, the Mac worker polls eBay and inserts it into Supabase, Bot 4 writes a policy-bound response, the Mac checks policy again and calls RespondToBestOffer, then records the sent status and pushes an ntfy notification.">
  <title>A Best Offer, end to end</title>
  <style>
    :root {
      --bg:#faf9f7; --card:#ffffff; --ink:#1f1e1d; --muted:#6b6862; --line:#ddd8cf; --arrow:#8a857d;
      --phone:#5b5fb0; --phone-soft:#eeeef9; --phone-edge:#c9cbea;
      --data:#66717c; --data-soft:#f0f2f4; --data-edge:#cbd1d6;
      --bot:#c96442; --bot-soft:#fbf0ea; --bot-edge:#ecc6b3;
      --mac:#2f7a68; --mac-soft:#eaf4f0; --mac-edge:#b3d6cb;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        color-scheme:dark;
        --bg:#1c1b1a; --card:#262523; --ink:#ece9e4; --muted:#a39f98; --line:#3d3a36; --arrow:#8f8a82;
        --phone:#9ea2ea; --phone-soft:#22233a; --phone-edge:#44477a;
        --data:#b9c1c9; --data-soft:#22272b; --data-edge:#46515a;
        --bot:#e08a66; --bot-soft:#2b221e; --bot-edge:#6b3f2e;
        --mac:#5fb39d; --mac-soft:#1c2825; --mac-edge:#2f5a4f;
      }
    }
    text { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .bg { fill:var(--bg); }
    .card { fill:var(--card); stroke:var(--line); }
    .card-data { fill:var(--card); stroke:var(--data); stroke-width:1.5; }
    .card-phone { fill:var(--card); stroke:var(--phone); stroke-width:1.5; }
    .card-bot { fill:var(--card); stroke:var(--bot); stroke-width:1.5; }
    .card-mac { fill:var(--card); stroke:var(--mac); stroke-width:1.5; }
    .title { fill:var(--ink); font-size:18px; font-weight:700; }
    .t { fill:var(--ink); font-size:12px; font-weight:650; }
    .label { fill:var(--muted); font-size:10px; }
    .label-bot { fill:var(--bot); font-size:9.5px; }
    .mono { fill:var(--muted); font:9.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .life { stroke:var(--line); stroke-width:1.2; stroke-dasharray:3 4; }
    .life-phone { stroke:var(--phone); }
    .rule { stroke:var(--line); stroke-width:1; }
    .ln { fill:none; stroke:var(--arrow); stroke-width:1.5; }
    .ln-data { stroke:var(--data); } .ln-bot { stroke:var(--bot); } .ln-mac { stroke:var(--mac); } .ln-phone { stroke:var(--phone); }
    .dash { stroke-dasharray:5 4; }
    .ah { fill:var(--arrow); } .ah-data { fill:var(--data); } .ah-bot { fill:var(--bot); } .ah-mac { fill:var(--mac); } .ah-phone { fill:var(--phone); }
    .footer { fill:var(--muted); font-size:10.5px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-data" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-bot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-bot" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-mac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-mac" d="M0 0L10 5L0 10z"/></marker>
    <marker id="arrow-phone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah-phone" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" width="1000" height="420"/>
  <text class="title" x="20" y="27">A Best Offer, end to end</text>

  <rect class="card" x="34" y="42" width="132" height="38" rx="9"/>
  <text class="t" x="100" y="66" text-anchor="middle">eBay buyer</text>
  <rect class="card" x="224" y="42" width="132" height="38" rx="9"/>
  <text class="t" x="290" y="66" text-anchor="middle">eBay</text>
  <rect class="card-mac" x="424" y="42" width="132" height="38" rx="9"/>
  <text class="t" x="490" y="66" text-anchor="middle">Mac worker</text>
  <rect class="card-data" x="624" y="42" width="132" height="38" rx="9"/>
  <text class="t" x="690" y="66" text-anchor="middle">Supabase</text>
  <rect class="card-bot" x="814" y="42" width="132" height="38" rx="9"/>
  <text class="t" x="880" y="66" text-anchor="middle">Bot 4</text>
  <rect class="card-phone" x="952" y="42" width="46" height="38" rx="9"/>
  <text class="t" x="975" y="58" text-anchor="middle" style="font-size:9.5px">Your</text>
  <text class="t" x="975" y="72" text-anchor="middle" style="font-size:9.5px">phone</text>

  <line class="life" x1="100" y1="80" x2="100" y2="370"/>
  <line class="life" x1="290" y1="80" x2="290" y2="370"/>
  <line class="life" x1="490" y1="80" x2="490" y2="370"/>
  <line class="life" x1="690" y1="80" x2="690" y2="370"/>
  <line class="life" x1="880" y1="80" x2="880" y2="370"/>
  <line class="life life-phone" x1="975" y1="80" x2="975" y2="380"/>

  <line class="ln" x1="100" y1="105" x2="288" y2="105" marker-end="url(#arrow)"/>
  <text class="label" x="194" y="97" text-anchor="middle">buyer makes an offer</text>

  <line class="ln ln-mac dash" x1="490" y1="135" x2="292" y2="135" marker-end="url(#arrow-mac)"/>
  <text class="label" x="391" y="127" text-anchor="middle">poll every 1 min: get inbox</text>

  <line class="ln ln-mac" x1="490" y1="169" x2="688" y2="169" marker-end="url(#arrow-mac)"/>
  <text class="label" x="589" y="151" text-anchor="middle">insert grok_inbox row</text>
  <text class="mono" x="589" y="163" text-anchor="middle">kind offer, listed and floor price</text>

  <line class="ln ln-bot dash" x1="690" y1="198" x2="878" y2="198" marker-end="url(#arrow-bot)"/>
  <text class="label" x="784" y="190" text-anchor="middle">trigger wakes Bot 4</text>

  <line class="ln ln-bot" x1="880" y1="241" x2="692" y2="241" marker-end="url(#arrow-bot)"/>
  <text class="label-bot" x="786" y="211" text-anchor="middle">accept at 92%+, otherwise counter</text>
  <text class="label-bot" x="786" y="224" text-anchor="middle">from floor to 92%, or at floor below it</text>
  <text class="label" x="786" y="236" text-anchor="middle">write response, status answered</text>

  <line class="ln ln-mac dash" x1="690" y1="280" x2="492" y2="280" marker-end="url(#arrow-mac)"/>
  <text class="label" x="591" y="251" text-anchor="middle">read answered row,</text>
  <text class="label" x="591" y="263" text-anchor="middle">re-check policy.json</text>
  <text class="mono" x="591" y="274" text-anchor="middle">never below the floor</text>

  <line class="ln ln-mac" x1="490" y1="306" x2="292" y2="306" marker-end="url(#arrow-mac)"/>
  <text class="mono" x="391" y="298" text-anchor="middle">RespondToBestOffer</text>

  <line class="ln" x1="290" y1="334" x2="102" y2="334" marker-end="url(#arrow)"/>
  <text class="label" x="196" y="326" text-anchor="middle">buyer sees accept or counter</text>

  <line class="ln ln-mac" x1="490" y1="357" x2="688" y2="357" marker-end="url(#arrow-mac)"/>
  <text class="mono" x="589" y="349" text-anchor="middle">status sent</text>
  <path class="ln ln-phone dash" d="M490 368 V376 H975" marker-end="url(#arrow-phone)"/>
  <text class="label" x="928" y="370" text-anchor="middle">ntfy push</text>

  <line class="rule" x1="20" y1="384" x2="980" y2="384"/>
  <text class="footer" x="500" y="407" text-anchor="middle">Vinted replies follow the same loop through Gmail and Bot 5, but the Mac only pushes the suggestion to your phone. You send it in the Vinted app.</text>
</svg>
